<!DOCTYPE html>

<head>

<meta name="robots" content="noindex, nofollow, noarchive">

<body>

<div id="pad" aria-hidden="true"></div>

<button id="klank" type="button" aria-label="Musiek aan of af">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
    <g class="aan">
      <path d="M15.6 9.2a4 4 0 0 1 0 5.6"/>
      <path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
    </g>
    <g class="stil">
      <path d="M16.4 9.8l5 4.4"/>
      <path d="M21.4 9.8l-5 4.4"/>
    </g>
  </svg>
</button>

<main id="toneel"></main>

<audio id="orrel" loop preload="auto" playsinline></audio>

<script src="inhoud.js"></script>
<script src="app.js"></script>

<script>
/* Net op die internet (https). Plaaslik oor die WiFi los ons dit uit,
   sodat jou veranderinge sonder gesukkel deurkom. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
